name: Installers

# Builds the Windows installer, the Mac disk image and the Linux packages (.tar.gz,
# AppImage and .deb). It runs only when started by hand from the Actions tab (Run
# workflow). Tick "Also make a draft release" to get a draft release with all the
# files; publishing that draft creates the version tag.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which installer to build (both = Windows, Mac and Linux)"
        type: choice
        options: [both, windows, mac, linux]
        default: both
      make_release:
        description: "Also make a draft release from the files (needs: both)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    # A tag builds both; a hand-started run builds what was chosen.
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    env:
      # Optional: with a code-signing certificate stored as these two secrets (see
      # docs/signing.md) the program and the installer are signed.
      WIN_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tidycuts-app
      - name: Put the program and FFmpeg together
        shell: pwsh
        run: |
          # LGPL build of FFmpeg, shipped as separate programs next to TidyCuts.
          # That download is replaced every day and is sometimes missing for a moment: try again.
          for ($i = 1; $i -le 5; $i++) { try { Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip; break } catch { if ($i -eq 5) { throw }; Start-Sleep -Seconds (20 * $i) } }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $src = Get-ChildItem ffmpeg-src -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/TidyCuts/ffmpeg | Out-Null
          Copy-Item target/release/tidycuts.exe dist/TidyCuts/TidyCuts.exe
          Copy-Item "$($src.FullName)/bin/ffmpeg.exe", "$($src.FullName)/bin/ffprobe.exe" dist/TidyCuts/ffmpeg/
          Copy-Item "$($src.FullName)/LICENSE.txt" dist/TidyCuts/ffmpeg/FFMPEG-LICENSE.txt
          Copy-Item README.md dist/TidyCuts/
          Copy-Item packaging/icons/tidycuts.ico dist/TidyCuts/TidyCuts.ico
      # Studio Voice: the voice model and ONNX Runtime (see packaging/voice-assets.txt).
      - name: Add the Studio Voice files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-voice-assets.ps1 -Dest dist/TidyCuts
      - name: Sign the program (only when a certificate is set up)
        if: ${{ env.WIN_CERT != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WIN_CERT))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/TidyCuts/TidyCuts.exe
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\windows\tidycuts.iss
      - name: Sign the installer (only when a certificate is set up)
        if: ${{ env.WIN_CERT != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WIN_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem dist/TidyCuts-Setup-*.exe).FullName
      - name: Zip the portable version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          Compress-Archive -Path dist/TidyCuts -DestinationPath "dist/TidyCuts-$version-windows-portable.zip"
      # The Microsoft Store package. It is not attached to the GitHub release (it
      # cannot be installed outside the Store); it is kept as a separate download
      # of the run. See docs/releasing.md.
      - name: Microsoft Store package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          ./scripts/make-msix.ps1 -Folder dist/TidyCuts -Version $version -Out dist-store
      - uses: actions/upload-artifact@v4
        with:
          name: TidyCuts-store-package
          path: dist-store/TidyCuts-*-store.msix
      - uses: actions/upload-artifact@v4
        with:
          name: TidyCuts-windows-files
          path: |
            dist/TidyCuts-Setup-*.exe
            dist/TidyCuts-*-windows-portable.zip

  ffmpeg-macos:
    name: FFmpeg for the Mac (LGPL)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ffmpeg-macos
          key: ffmpeg-macos-lgpl-7.1
      - name: Build FFmpeg without GPL parts
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://ffmpeg.org/releases/ffmpeg-7.1.tar.xz | tar xJ
          cd ffmpeg-7.1
          ./configure --disable-gpl --disable-nonfree --disable-doc --disable-ffplay \
            --enable-videotoolbox --enable-audiotoolbox --disable-autodetect \
            --enable-static --disable-shared
          make -j"$(sysctl -n hw.ncpu)"
          mkdir -p ../ffmpeg-macos
          cp ffmpeg ffprobe ../ffmpeg-macos/
          cp COPYING.LGPLv2.1 ../ffmpeg-macos/FFMPEG-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ffmpeg-macos

  whisper-macos:
    name: whisper.cpp for the Mac (MIT)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version of whisper.cpp to build
        id: ver
        run: echo "tag=$(grep -m1 '^WHISPER_CPP_TAG=' packaging/voice-assets.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: whisper-macos
          key: whisper-macos-${{ steps.ver.outputs.tag }}
      - name: Build whisper-cli (Apple silicon, Metal inside)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.ver.outputs.tag }}" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j --config Release --target whisper-cli
          mkdir -p ../whisper-macos
          cp build/bin/whisper-cli ../whisper-macos/
          cp LICENSE ../whisper-macos/WHISPER-CPP-LICENSE.txt
      - run: ./whisper-macos/whisper-cli --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-macos
          path: whisper-macos

  sdcpp-macos:
    name: stable-diffusion.cpp for the Mac (MIT)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: The version of stable-diffusion.cpp to build
        id: ver
        run: echo "tag=$(grep -m1 '^SD_CPP_TAG=' packaging/voice-assets.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: sdcpp-macos
          key: sdcpp-macos-${{ steps.ver.outputs.tag }}-2
      - name: Build sd-cli (Apple silicon, Metal)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch "${{ steps.ver.outputs.tag }}" https://github.com/leejet/stable-diffusion.cpp
          cd stable-diffusion.cpp
          # Metal = the graphics chip of an M1 or newer; the shaders are built into the program.
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON             -DBUILD_SHARED_LIBS=OFF -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j --config Release --target sd-cli sd-server
          mkdir -p ../sdcpp-macos
          cp build/bin/sd-cli build/bin/sd-server ../sdcpp-macos/
          cp LICENSE ../sdcpp-macos/STABLE-DIFFUSION-CPP-LICENSE.txt
      - run: ./sdcpp-macos/sd-cli --help | head -3 && ./sdcpp-macos/sd-server --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: sdcpp-macos
          path: sdcpp-macos

  macos:
    name: Mac app and disk image
    runs-on: macos-latest
    needs: [ffmpeg-macos, whisper-macos, sdcpp-macos]
    env:
      # Optional: an Apple "Developer ID Application" certificate (see docs/signing.md).
      MAC_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MAC_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MAC_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    # A Mac app without FFmpeg still works if the person installs it
    # themselves, so a failed FFmpeg build doesn't stop the app.
    if: ${{ !cancelled() && (inputs.platform == 'both' || inputs.platform == 'mac') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ffmpeg-macos
          path: ffmpeg-macos
      - run: chmod +x ffmpeg-macos/* || true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: whisper-macos
          path: whisper-macos
      - run: chmod +x whisper-macos/whisper-cli || true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sdcpp-macos
          path: sdcpp-macos
      - run: chmod +x sdcpp-macos/sd-cli sdcpp-macos/sd-server || true
      - run: cargo build --release -p tidycuts-app
      # Studio Voice: the voice model and ONNX Runtime, kept in ./voice-assets until
      # make-macos-app.sh moves them into the app (see packaging/voice-assets.txt).
      - name: Fetch the Studio Voice files
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-voice-assets.sh voice-assets
      - name: Import the signing certificate (only when one is set up)
        if: ${{ env.MAC_CERT != '' }}
        run: |
          echo "$MAC_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "SIGN_IDENTITY=$MAC_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Make the app and the disk image
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash scripts/make-macos-app.sh target/release/tidycuts dist
          bash scripts/make-macos-dmg.sh dist "dist/TidyCuts-$version-macos.dmg"
      - name: Notarize with Apple (only when an Apple account is set up)
        if: ${{ env.MAC_CERT != '' && env.APPLE_ID != '' }}
        run: |
          ditto -c -k --keepParent dist/TidyCuts.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/TidyCuts.app
          rm -f "dist/TidyCuts-$VERSION-macos.dmg"
          bash scripts/make-macos-dmg.sh dist "dist/TidyCuts-$VERSION-macos.dmg"
      - name: Check the app inside the disk image
        run: |
          mount=$(mktemp -d)
          hdiutil attach "dist/TidyCuts-$VERSION-macos.dmg" -mountpoint "$mount" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$mount/TidyCuts.app"
          codesign -dv "$mount/TidyCuts.app" 2>&1 | head -12
          lipo -info "$mount/TidyCuts.app/Contents/MacOS/TidyCuts"
          ls -l "$mount" "$mount/TidyCuts.app/Contents/Resources"
          hdiutil detach "$mount"
      # The same app as a zip, in case the disk image is awkward to open.
      - run: ditto -c -k --keepParent dist/TidyCuts.app "dist/TidyCuts-$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TidyCuts-macos-dmg
          path: |
            dist/TidyCuts-*-macos.dmg
            dist/TidyCuts-*-macos.zip

  natives-linux:
    name: whisper.cpp and stable-diffusion.cpp for Linux (MIT)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'linux' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The versions to build
        id: ver
        run: |
          echo "whisper=$(grep -m1 '^WHISPER_CPP_TAG=' packaging/voice-assets.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "sd=$(grep -m1 '^SD_CPP_TAG=' packaging/voice-assets.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: natives-linux
          key: natives-linux-${{ steps.ver.outputs.whisper }}-${{ steps.ver.outputs.sd }}-2
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The Vulkan SDK (with its shader compiler, glslc) from LunarG's package source.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list http://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential git libcurl4-openssl-dev vulkan-sdk || sudo apt-get install -y --no-install-recommends cmake build-essential git libcurl4-openssl-dev libvulkan-dev
      # whisper-cli on the processor, with the variants for older and newer processors
      # inside, so it runs on any 64-bit PC.
      - name: Build whisper-cli
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ steps.ver.outputs.whisper }}" https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON "-DCMAKE_INSTALL_RPATH=\$ORIGIN"
          cmake --build build --parallel 3 --config Release --target whisper-cli
          mkdir -p ../natives-linux/whisper-linux
          cp build/bin/whisper-cli ../natives-linux/whisper-linux/
          find build -name '*.so*' -exec cp -a {} ../natives-linux/whisper-linux/ \;
          cp LICENSE ../natives-linux/whisper-linux/WHISPER-CPP-LICENSE.txt
      # sd-cli and sd-server with Vulkan (NVIDIA, AMD and Intel graphics cards). The shader
      # compiler comes with the Vulkan SDK from LunarG. If that cannot be had, a build for the
      # processor is made so the package is still complete (very slow pictures).
      - name: Build sd-cli and sd-server
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recursive --branch "${{ steps.ver.outputs.sd }}" https://github.com/leejet/stable-diffusion.cpp
          cd stable-diffusion.cpp
          vulkan=OFF
          if command -v glslc > /dev/null 2>&1; then vulkan=ON; fi
          echo "Vulkan build: $vulkan"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DSD_VULKAN=$vulkan -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --parallel 3 --config Release --target sd-cli sd-server
          mkdir -p ../natives-linux/sdcpp-linux
          cp build/bin/sd-cli build/bin/sd-server ../natives-linux/sdcpp-linux/
          cp LICENSE ../natives-linux/sdcpp-linux/STABLE-DIFFUSION-CPP-LICENSE.txt
      - run: ./natives-linux/whisper-linux/whisper-cli --help | head -3
      - run: ./natives-linux/sdcpp-linux/sd-cli --help | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux
          path: natives-linux

  linux:
    name: Linux packages (tar.gz, AppImage, deb)
    if: ${{ !cancelled() && (inputs.platform == 'both' || inputs.platform == 'linux') }}
    needs: [natives-linux]
    # The oldest long-supported Ubuntu, so the program runs on newer systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: natives-linux
          path: natives-linux
      - run: cargo build --release -p tidycuts-app
      - name: Make the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          bash scripts/make-linux-package.sh target/release/tidycuts dist "$version" natives-linux
      - name: Look inside the packages
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          ls -l dist
          dpkg-deb --info "dist/tidycuts_${version}_amd64.deb" | head -20
          dpkg-deb --contents "dist/tidycuts_${version}_amd64.deb" | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: TidyCuts-linux-files
          path: |
            dist/TidyCuts-*-linux-x86_64.tar.gz
            dist/TidyCuts-*-linux-x86_64.AppImage
            dist/tidycuts_*_amd64.deb

  release:
    name: Attach to the release
    # Only when started by hand with "Also make a draft release" ticked.
    if: ${{ success() && inputs.make_release && inputs.platform == 'both' }}
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TidyCuts-*-files
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: TidyCuts-macos-dmg
          path: out
      - name: Checksums and notes
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "TAG=v$version" >> "$GITHUB_ENV"
          (cd out && sha256sum TidyCuts-* tidycuts_* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed -e "s/__VERSION__/$version/g" -e "s#__REPO__#$GITHUB_REPOSITORY#g" .github/release-notes.md > notes.md
      # A draft, so nothing is published until it is reviewed.
      # (Creates the tag too when it doesn't exist yet.)
      - run: gh release create "$TAG" out/* --draft --target "$GITHUB_SHA" --title "TidyCuts ${TAG#v}" --notes-file notes.md -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
