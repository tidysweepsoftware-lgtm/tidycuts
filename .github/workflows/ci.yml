name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libasound2-dev libxkbcommon-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tidycuts-app
      - name: Package with FFmpeg
        shell: pwsh
        run: |
          # LGPL build of FFmpeg, shipped as separate programs next to TidyCuts.
          # That download is replaced every day and is sometimes missing for a moment: try again.
          for ($i = 1; $i -le 5; $i++) { try { Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -OutFile ffmpeg.zip; break } catch { if ($i -eq 5) { throw }; Start-Sleep -Seconds (20 * $i) } }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          $src = Get-ChildItem ffmpeg-src -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force dist/TidyCuts/ffmpeg | Out-Null
          Copy-Item target/release/tidycuts.exe dist/TidyCuts/TidyCuts.exe
          Copy-Item "$($src.FullName)/bin/ffmpeg.exe", "$($src.FullName)/bin/ffprobe.exe" dist/TidyCuts/ffmpeg/
          Copy-Item "$($src.FullName)/LICENSE.txt" dist/TidyCuts/ffmpeg/FFMPEG-LICENSE.txt
          Copy-Item README.md dist/TidyCuts/
      - uses: actions/upload-artifact@v4
        with:
          name: TidyCuts-windows-x64
          path: dist/TidyCuts
