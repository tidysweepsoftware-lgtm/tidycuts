[workspace]
resolver = "2"
members = [
    "crates/tidycuts-core",
    "crates/tidycuts-media",
    "crates/tidycuts-render",
    "crates/tidycuts-engine",
    "crates/tidycuts-sounds",
    "crates/tidycuts-mcp",
    "crates/tidycuts-app",
]

[workspace.package]
version = "1.3.2"
edition = "2021"
publish = false

[workspace.dependencies]
tidycuts-core = { path = "crates/tidycuts-core" }
tidycuts-media = { path = "crates/tidycuts-media" }
tidycuts-render = { path = "crates/tidycuts-render" }
tidycuts-engine = { path = "crates/tidycuts-engine" }
tidycuts-sounds = { path = "crates/tidycuts-sounds" }
tidycuts-mcp = { path = "crates/tidycuts-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

# Sound synthesis is pure number crunching; keep it fast in debug builds and tests too.
[profile.dev.package.tidycuts-sounds]
opt-level = 3

[profile.release]
strip = true
