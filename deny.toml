# Licence and advisory policy, checked with `cargo deny check`.
# Only permissive licences are allowed: nothing that would force TidyCuts or
# the videos people make with it under a copyleft licence.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
# TidyCuts' own crates are not published to crates.io; they carry the
# project licence once it is chosen (set `license` in Cargo.toml).
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
